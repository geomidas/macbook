---
- name: Ensure Homebrew is installed
  community.general.homebrew:
    state: present

- name: Tap HashiCorp formulae
  community.general.homebrew_tap:
    name: hashicorp/tap
    state: present

- name: Trust HashiCorp tap so Homebrew will load its formulae
  ansible.builtin.command:
    cmd: brew trust --tap hashicorp/tap
  register: hashicorp_trust
  changed_when: "'Already trusted' not in hashicorp_trust.stdout + hashicorp_trust.stderr"

- name: Install command line tools
  community.general.homebrew:
    name:
      - starship
      - git
      - fzf
      - fzf-tab
      - tree
      - wget
      - node
      - watch
      - kubectl
      - kubectx
      - helm
      - shellcheck
      - ansible
      - hashicorp/tap/terraform
      - swiftlint
      - swiftformat
      - zsh-history-substring-search
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - zsh-navigation-tools
      - font-hack-nerd-font
      - font-m+-nerd-font
      - font-profont-nerd-font
      - awscli
    state: present

- name: Register Homebrew-installed fonts with macOS
  ansible.builtin.command:
    cmd: swift {{ role_path }}/files/register-fonts.swift
  register: font_registration
  changed_when: "'registered=0 ' not in font_registration.stdout"

- name: Check if iTerm2 is already installed
  ansible.builtin.stat:
    path: /Applications/iTerm.app
  register: iterm2_app

- name: Install iTerm2 via Homebrew if not present
  community.general.homebrew_cask:
    name: iterm2
    state: present
    install_options: appdir=/Applications
  when: not iterm2_app.stat.exists

- name: Check if Google Chrome is already installed
  ansible.builtin.stat:
    path: /Applications/Google Chrome.app
  register: chrome_app

- name: Install Google Chrome via Homebrew if not present
  community.general.homebrew_cask:
    name: google-chrome
    state: present
    install_options: appdir=/Applications
  when: not chrome_app.stat.exists

