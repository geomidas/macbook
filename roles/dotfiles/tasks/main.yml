---
- name: Create the ~/.config directory
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config"
    state: directory
    mode: '0755'

- name: Disable motd (message of the day)
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.hushlogin"
    state: touch
    mode: '0644'

- name: Create an empty ~/.env file if it does not exist
  ansible.builtin.copy:
    content: ""
    dest: "{{ ansible_facts['user_dir'] }}/.env"
    force: false
    mode: '0600'

- name: Create symbolic links for dotfiles
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item }}"
    state: link
    force: yes
  loop:
    - .zshrc
    - .aliases
    - .vimrc
    - .config/starship.toml
