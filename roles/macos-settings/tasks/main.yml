---
- name: Show hidden files in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: AppleShowAllFiles
    type: boolean
    value: true
    state: present
  notify: restart finder

- name: Show file extensions in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: AppleShowAllExtensions
    type: boolean
    value: true
    state: present
  notify: restart finder

- name: Show path bar in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowPathbar
    type: boolean
    value: true
    state: present
  notify: restart finder

- name: Show status bar in Finder
  community.general.osx_defaults:
    domain: com.apple.finder
    key: ShowStatusBar
    type: boolean
    value: true
    state: present
  notify: restart finder

- name: Disable "Empty trash" warning
  community.general.osx_defaults:
    domain: com.apple.finder
    key: WarnOnEmptyTrash
    type: boolean
    value: false
    state: present
  notify: restart finder

- name: Disable "Are you sure you want to open this application?" dialog
  community.general.osx_defaults:
    domain: com.apple.LaunchServices
    key: LSQuarantine
    type: boolean
    value: false
    state: present

- name: Disable automatic capitalization
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: boolean
    value: false
    state: present

# Not using osx_defaults here: System Settings may store Clicking as an int,
# and osx_defaults fails with "Type mismatch" instead of overwriting it.
- name: Enable tap to click (built-in and Bluetooth trackpads)
  ansible.builtin.shell: |
    if [ "$(defaults read {{ item }} Clicking 2>/dev/null)" = "1" ]; then
      echo unchanged
    else
      defaults write {{ item }} Clicking -bool true && echo changed
    fi
  loop:
    - com.apple.AppleMultitouchTrackpad
    - com.apple.driver.AppleBluetoothMultitouch.trackpad
  register: tap_to_click
  changed_when: tap_to_click.stdout == "changed"
  notify: restart systemuiserver

- name: Enable tap to click for current user
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1
    state: present
  notify: restart systemuiserver
